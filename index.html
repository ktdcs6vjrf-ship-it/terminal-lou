 pas dans le dépôt ;\n  - Kaggle : connexion requise, et le fichier 1m ne couvre qu'une semaine.\n- **Comparaison** : CFD Dukascopy sur la même fenêtre (09/07/2024 → 30/10/2026, 598 jours), en 1m et rééchantillonné en 1h.\n- Même grille (864 configs), même IS/OOS 70/30, BH, bootstrap, benchmark aléatoire, coûts de 1,5 pt.\n- En 1h, la session RTH commence à 09:00 (bougie horaire) et l'ambiguïté stop/cible dans une même bougie compte comme perte. Le 1h est donc plus pessimiste que le 1m.\n\n## Maintien dans les murs (VXN, centre settle, Globex)\n| | k=1 | k=1,645 | k=2 |\n|---|---|---|---|\n| NQ=F 1h | 59,3 % | 89,0 % | 93,3 % |\n| CFD 1m/1h | 59,2 % | 89,3 % | 94,1 % |\n\nLe future et le CFD concordent. Le « 90 % » est confirmé à k=1,645.\n\n## Meilleure config IS → résultat OOS\n| Série | Config (choisie en IS) | IS n / win / PF / pts | OOS n | win | PF | pts/trade | $ MNQ | max DD | IC95 pts | p | p BH |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| **NQ=F 1h** | HV20, k=1,645, settle, RTH, SL 0,25σ, TP mur opposé | 82 / 29 % / 1,61 / +25,5 | 37 | 27,0 % | 0,95 | −2,6 | −5,1 | 848 pts (1696 $) | [−40,4 ; +41,3] | 0,55 | 1,0 |\n| CFD 1h | HV20, k=2, settle, RTH, SL 0,1σ, TP opp | 63 / 24 % / 5,51 / +77,2 | 24 | 16,7 % | 0,78 | −5,9 | −11,8 | 229 pts | [−27,5 ; +20,7] | 0,68 | 1,0 |\n| CFD 1m | blend, k=2, settle, RTH, SL 0,25σ, TP opp | 35 / 37 % / 2,71 / +71,8 | 12 | 25 % | 0,38 | −39,3 | −78,5 | 566 pts | [−81,7 ; +10,4] | 0,93 | 1,0 |\n\n- Aucune config n'est significative après BH, en IS comme en OOS, sur aucune série.\n- **Benchmark direction aléatoire (NQ 1h)** : −27,1 pts [−56,1 ; +1,5]. La stratégie fait mieux que l'aléatoire (p=0,047) mais reste perdante en absolu. Pour le CFD 1h, p=0,095 ; pour le CFD 1m, p=0,75.\n- **19 gains d'affilée** avec 27 % de gains : 1,6×10⁻¹¹.\n- Le backtest CFD long 2019–2026 (dossier `bt/`) donnait un OOS positif mais non significatif (+27 pts, IC incluant 0). Sur la fenêtre 2024–2026, ni le future ni le CFD ne le confirment.\n\n## Verdict\nPas d'edge. Sur le vrai future, les murs tiennent bien (89–90 % à 1,645σ), mais fader le mur une fois touché ne donne aucune espérance positive hors échantillon. Le 1h du future et le CFD disent la même chose.\n"},{"id":"insta1b","title":"IV walls — backtest CFD long 2019–2026","md":"# Backtest « IV walls » (reel Instagram) — NQ1!\n\n**Données**\n- Intraday : Dukascopy USATECHIDXUSD 1m (CFD Nasdaq-100, proxy de NQ1!), 31/01/2019 → 30/10/2026, 2002 jours. IS 70 % jusqu'au 03/07/2024, OOS 30 % à partir du 04/07/2024.\n- Journalier : NQ=F + ^VXN (yfinance), 24/01/2001 → 30/10/2026, 6479 jours.\n- Coûts : 1,5 pt aller-retour. MNQ 2 $/pt, NQ 20 $/pt. Si stop et cible sont touchés dans la même bougie, le trade compte comme perdu. Si le prix ouvre au-delà du mur (gap), le stop se calcule depuis le prix d'exécution.\n- Grille : 864 configurations (source σ × k × centre × session × stop × cible).\n\n**Taux de maintien dans les murs** (VXN, centré sur le settle)\n- Journalier depuis 2001 : 59,4 % à k=1 ; 89,6 % à k=1,645 ; 95,4 % à k=2.\n- Intraday : 60–61 % ; 90 % ; 95,5 %.\n- HV20 : 78 % à k=1,645. Mélange VXN/HV20 : 86 %.\n- Le « 90 % » est donc correct pour VXN à 1,645σ. Mais ça veut seulement dire que **les murs ne sont presque jamais touchés** : le mur haut l'est 4 % des jours.\n\n**Test journalier approximatif** (short au mur haut, stop 0,25σ, sortie à la clôture) : espérance négative pour tous les k (−2,9 / −5,3 / −9,1 pts). Le taux de gain est de 31–34 %.\n\n**Meilleure config IS → OOS** : VXN, k=2, centre settle, RTH, stop 20 pts, cible mur opposé.\n- IS : 56 trades, 30 % de gains, PF 2,10, +16,3 pts (+32,7 $ MNQ) par trade, p=0,08, p ajusté BH=1.\n- OOS : 34 trades, 20,6 % de gains, PF 2,60, +27,3 pts = **+54,6 $ MNQ / +546 $ NQ par trade**. Max DD 208 pts (415 $ MNQ). IC 95 % bootstrap [−13,6 ; +87,5] pts, p=0,16, **p ajusté BH = 1,0**. 0 config significative après BH, ni en IS ni en OOS.\n- Benchmark direction aléatoire (mêmes entrées) : +4

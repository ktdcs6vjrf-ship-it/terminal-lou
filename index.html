<style>
:root{--bg:#000;--p:#0a0a0a;--p2:#111;--ln:#1d1d1d;--ln2:#2a2a2a;--tx:#e8e8e8;--mu:#8a8a8a;--dim:#555;--ac:#a78bfa;--g:#34d399;--r:#f87171;--y:#fbbf24;--b:#60a5fa;--m:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--tx);font:13px/1.5 var(--m);-webkit-font-smoothing:antialiased}

 depuis 2001 : 59,4 % à k=1 ; 89,6 % à k=1,645 ; 95,4 % à k=2.\n- Intraday : 60–61 % ; 90 % ; 95,5 %.\n- HV20 : 78 % à k=1,645. Mélange VXN/HV20 : 86 %.\n- Le « 90 % » est donc correct pour VXN à 1,645σ. Mais ça veut seulement dire que **les murs ne sont presque jamais touchés** : le mur haut l'est 4 % des jours.\n\n**Test journalier approximatif** (short au mur haut, stop 0,25σ, sortie à la clôture) : espérance négative pour tous les k (−2,9 / −5,3 / −9,1 pts). Le taux de gain est de 31–34 %.\n\n**Meilleure config IS → OOS** : VXN, k=2, centre settle, RTH, stop 20 pts, cible mur opposé.\n- IS : 56 trades, 30 % de gains, PF 2,10, +16,3 pts (+32,7 $ MNQ) par trade, p=0,08, p ajusté BH=1.\n- OOS : 34 trades, 20,6 % de gains, PF 2,60, +27,3 pts = **+54,6 $ MNQ / +546 $ NQ par trade**. Max DD 208 pts (415 $ MNQ). IC 95 % bootstrap [−13,6 ; +87,5] pts, p=0,16, **p ajusté BH = 1,0**. 0 config significative après BH, ni en IS ni en OOS.\n- Benchmark direction aléatoire (mêmes entrées) : +4,6 pts [−18,0 ; +28,0]. La stratégie fait mieux que 96 % des tirages aléatoires (p=0,039), mais sur 34 trades et avec un IC qui inclut 0.\n- Probabilité de 19 gains d'affilée avec 20,6 % de gains : 9×10⁻¹⁴. Avec 30 % : environ 10⁻¹⁰. Le « 100 % sur 19 trades » n'est pas crédible : c'est de la sélection ou des trades non réalisés.\n\n**Vrais IV walls gexbot** : aucune archive /iv trouvée. On a seulement des snapshots CBOE reconstruits (30/10, 31/10, 02/11), donc **1 seul jour testable** (30/10). Ce jour-là, le mur bas à 1σ (28832) a été touché par le CFD (plus bas RTH 28097), le mur à 2σ (28262) aussi : un long aurait été stoppé. Attention : l'écart entre le spot NDX du snapshot (29402) et le CFD est d'environ 700 pts. Le résultat n'a aucune valeur statistique.\n\n**Verdict** : aucun edge démontré. Les murs à 90 % tiennent bien statistiquement, mais trader le retour à l'intérieur une fois le mur touché ne donne pas d'espérance positive robuste. Le seul signe favorable (k=2, RTH, petit stop function tick(){const n=new Date(),p=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'}).formatToParts(n),g=k=>(p.find(x=>x.type==k)||{}).value,h=+g('hour')+ +g('minute')/60,wd=g('weekday');const we=/sam|dim/.test(wd);
 const age=(n-gen)/6e4,a=age<60?Math.round(age)+' min':age<1440?Math.round(age/60)+' h':Math.round(age/1440)+' j',c=age<120?'var(--g)':age<1440?'var(--y)':'var(--r)';
 document.getElementById('stb').innerHTML=`<span class="ck">${g('hour')}:${g('minute')}:${g('second')} <small style="color:var(--mu);font-weight:400">Paris</small></span><span class="ss">${S.map(([l,a,b])=>`<span class="${!we&&h>=a&&h<b?'on':''}">${l}</span>`).join('')}</span><span class="fr" style="--c:${c}">MAJ ${a}</span>`}
tick();setInterval(tick,1000);
// jauge gamma (données D.levels.gamma uniquement)
if(G&&G.net_both!=null){const v=G.net_both,pos=v>=0,f=Math.tanh(Math.abs(v)/1e9),top=50-(pos?1:-1)*f*46,c=pos?'#34d399':'#f87171',el=document.createElement('div');el.id='gr';el.setAttribute('role','img');el.setAttribute('aria-label',`Régime gamma ${G.regime}, GEX net ${fmt(v/1e6,0)} M$`);el.style.setProperty('--c',c);
 el.innerHTML=`<span class="lb">+γ</span><div class="tr"><div class="nd" style="top:50%"></div></div><span class="lb">−γ</span><span class="rg">${(G.regime||'').toUpperCase()} ${fmt(v/1e9,2)}B</span>`;el.style.height='250px';document.body.appendChild(el);requestAnimationFrame(()=>setTimeout(()=>el.querySelector('.nd').style.top=top+'%',300));el.onclick=()=>{location.hash='accueil';setTimeout(()=>{const h=[...document.querySelectorAll('.card h3')].find(x=>x.textContent.startsWith('Régime gamma'));h&&h.scrollIntoView({behavior:'smooth',block:'center'})},200)}}
// badges par desk (données existantes)
const B={accueil:G&&(G.net_both<0?'var(--r)':'var(--g)'),macro:D.bias&&(D.bias.score>0?'var(--g)':D.bias.score<0?'var(--r)':'var(--y)'),journal:(D.journal||[]).length?'var(--ac)':null,quant:D.zlab?'var(--b)':null};
document.querySelectorAll('#nav button').forEach(b=>{const c=B[b.dataset.t];if(c){const s=b.querySelector('.s');s&&s.insertAdjacentHTML('beforeend',`<i class="badge" style="--bc:${c}"></i>`)}});
// micro-interactions
document.addEventListener('click',e=>{if(e.target.closest('button,.tile,.jt')&&navigator.vibrate)navigator.vibrate(8)},true);
// pull-to-refresh
let y0=null,pt=document.getElementById('ptr');addEventListener('touchstart',e=>{y0=scrollY<=0?e.touches[0].clientY:null},{passive:true});
addEventListener('touchmove',e=>{if(y0==null)return;const d=e.touches[0].clientY-y0;if(d>0)pt.style.transform=`translate(-50%,${Math.min(d/2,40)-60}px)`},{passive:true});
addEventListener('touchend',e=>{if(y0==null)return;const d=e.changedTouches[0].clientY-y0;y0=null;if(d>140){pt.style.transform='translate(-50%,0)';setTimeout(()=>location.reload(),350)}else pt.style.transform=''},{passive:true});
})();
</script></body></html>
